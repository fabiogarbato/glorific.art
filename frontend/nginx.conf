server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Default do nginx e 1MB — foto de celular passa disso fácil e cai com 413
    # antes de chegar no backend (que aceita ate 12MB, ver MidiasAdminController).
    client_max_body_size 12M;

    # A API .NET no mesmo compose, via DNS interno do Docker.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Imagens do storage local da API (Storage:Local, serve estatico em /media).
    location /media/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assets do build (JS/CSS/imagens) tem hash no nome — podem cachear "pra sempre".
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # SPA: qualquer rota que não seja arquivo estático cai no index.html.
    # index.html NUNCA pode ser cacheado — e ele que aponta pro JS/CSS com hash
    # do build atual. Cache aqui significa: navegador continua rodando o
    # bundle antigo depois de todo deploy novo, sem nenhum aviso.
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
